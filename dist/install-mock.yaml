apiVersion: apps/v1
kind: Deployment
metadata:
  labels:
    app.kubernetes.io/managed-by: kustomize
    app.kubernetes.io/name: api-extension
    control-plane: controller-manager
  name: api-extension-controller-manager
  namespace: harikube
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: api-extension
      control-plane: controller-manager
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        app.kubernetes.io/name: api-extension
        control-plane: controller-manager
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
            - matchExpressions:
              - key: kubernetes.io/arch
                operator: In
                values:
                - arm64
                - amd64
                - s390x
                - ppc64le
              - key: kubernetes.io/os
                operator: In
                values:
                - linux
      containers:
      - args:
        - --metrics-bind-address=:8443
        - --leader-elect=false
        - --health-probe-bind-address=:8081
        - --harikube-skip-verify=false
        - --core-resources=$(CORE_RESOURCES)
        - --apiserver-port=:7443
        - --apiserver-cert-file=/tmp/k8s-apiserver-server/serving-certs/tls.crt
        - --apiserver-key-file=/tmp/k8s-apiserver-server/serving-certs/tls.key
        - --harikube-urls=/tmp/harikube-connection/harikube.url
        - --decision-maker-url=$(DECISION_MAKER_URL)
        - --decision-maker-timeout=$(DECISION_MAKER_TIMEOUT)
        command:
        - /manager
        env:
        - name: CORE_RESOURCES
          valueFrom:
            configMapKeyRef:
              key: resources
              name: api-extension-core-resources
        - name: DECISION_MAKER_URL
          valueFrom:
            configMapKeyRef:
              key: url
              name: api-extension-decision-maker
        - name: DECISION_MAKER_TIMEOUT
          valueFrom:
            configMapKeyRef:
              key: timeout
              name: api-extension-decision-maker
        image: harikube/api-extension:mock-f014d
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        name: manager
        ports:
        - containerPort: 7443
          name: apiserver
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        resources:
          limits:
            cpu: 500m
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        volumeMounts:
        - mountPath: /tmp/k8s-apiserver-server/serving-certs
          name: apiserver-certs
          readOnly: true
        - mountPath: /tmp/harikube-connection
          name: harikube-connection
          readOnly: true
      - args:
        - |
          echo "decision-maker starting with provider=${DECISION_MAKER_PROVIDER}"
          mkdir -p /tmp/decision-maker "${NPM_CONFIG_CACHE}" "${HOME}"
          cp /opt/decision-maker/server.mjs /tmp/decision-maker/server.mjs
          cd /tmp/decision-maker
          if [ "${DECISION_MAKER_PROVIDER}" = "laya" ]; then
            echo "installing @receptron/laya into /tmp/decision-maker"
            npm init -y >/dev/null 2>&1
            npm install --omit=dev @receptron/laya
            echo "finished installing @receptron/laya"
          fi
          exec node /tmp/decision-maker/server.mjs
        command:
        - /bin/sh
        - -ec
        env:
        - name: DECISION_MAKER_PROVIDER
          valueFrom:
            configMapKeyRef:
              key: provider
              name: api-extension-decision-maker
        - name: DECISION_MAKER_PORT
          valueFrom:
            configMapKeyRef:
              key: port
              name: api-extension-decision-maker
        - name: LAYA_CACHE
          valueFrom:
            configMapKeyRef:
              key: laya-cache
              name: api-extension-decision-maker
        - name: HOME
          value: /tmp/decision-maker/home
        - name: NPM_CONFIG_CACHE
          value: /var/cache/laya/.npm
        - name: HF_TOKEN
          valueFrom:
            secretKeyRef:
              key: hf-token
              name: api-extension-decision-maker-secrets
              optional: true
        image: node:20-bookworm-slim
        imagePullPolicy: IfNotPresent
        livenessProbe:
          httpGet:
            path: /healthz
            port: decision-http
          initialDelaySeconds: 10
          periodSeconds: 20
        name: decision-maker
        ports:
        - containerPort: 8088
          name: decision-http
          protocol: TCP
        readinessProbe:
          httpGet:
            path: /healthz
            port: decision-http
          initialDelaySeconds: 2
          periodSeconds: 10
        resources:
          limits:
            cpu: 2
            memory: 4Gi
          requests:
            cpu: 250m
            memory: 1Gi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: false
          runAsGroup: 65532
          runAsNonRoot: true
          runAsUser: 65532
          seccompProfile:
            type: RuntimeDefault
        startupProbe:
          failureThreshold: 90
          httpGet:
            path: /healthz
            port: decision-http
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - mountPath: /opt/decision-maker/server.mjs
          name: decision-maker-script
          readOnly: true
          subPath: server.mjs
      securityContext:
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
