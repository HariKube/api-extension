apiVersion: chainsaw.kyverno.io/v1alpha1
kind: Test
metadata:
  name: harikube
spec:
  namespace: default
  skipDelete: true
  timeouts:
    assert: 5m
  steps:
  - name: Deploy HariKube
    try:
    - script:
        content: helm install harikube oci://quay.io/harikube/harikube --version 0.16.3 --namespace=harikube --create-namespace --set vcluster.exportKubeConfig.server=https://harikube.harikube:443 --set middleware.image.tag=dev-v0.16.4-1
    - assert:
        resource:
          apiVersion: apps/v1
          kind: StatefulSet
          metadata:
            name: harikube
            namespace: harikube
          status:
            availableReplicas: 1
