- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --core-resources=$(CORE_RESOURCES)

- op: add
  path: /spec/template/spec/containers/0/env
  value:
    - name: CORE_RESOURCES
      valueFrom:
        configMapKeyRef:
          name: api-extension-core-resources
          key: resources
    - name: DECISION_MAKER_URL
      valueFrom:
        configMapKeyRef:
          name: api-extension-decision-maker
          key: url
    - name: DECISION_MAKER_TIMEOUT
      valueFrom:
        configMapKeyRef:
          name: api-extension-decision-maker
          key: timeout

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --apiserver-port=:7443

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --apiserver-cert-file=/tmp/k8s-apiserver-server/serving-certs/tls.crt

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --apiserver-key-file=/tmp/k8s-apiserver-server/serving-certs/tls.key

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --harikube-urls=/tmp/harikube-connection/harikube.url

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --decision-maker-url=$(DECISION_MAKER_URL)

- op: add
  path: /spec/template/spec/containers/0/args/-
  value: --decision-maker-timeout=$(DECISION_MAKER_TIMEOUT)

# - op: add
#   path: /spec/template/spec/containers/0/args/-
#   value: --harikube-cert-file=/tmp/harikube-middleware-crt/tls.crt

# - op: add
#   path: /spec/template/spec/containers/0/args/-
#   value: --harikube-key-file=/tmp/harikube-middleware-crt/tls.key

# - op: add
#   path: /spec/template/spec/containers/0/args/-
#   value: --harikube-ca-file=/tmp/harikube-middleware-crt/ca.crt

- op: add
  path: /spec/template/spec/containers/0/ports/-
  value:
    containerPort: 7443
    name: apiserver
    protocol: TCP

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    mountPath: /tmp/k8s-apiserver-server/serving-certs
    name: apiserver-certs
    readOnly: true

- op: add
  path: /spec/template/spec/containers/0/volumeMounts/-
  value:
    mountPath: /tmp/harikube-connection
    name: harikube-connection
    readOnly: true

- op: add
  path: /spec/template/spec/containers/-
  value:
    name: decision-maker
    image: node:20-bookworm-slim
    imagePullPolicy: IfNotPresent
    command:
    - /bin/sh
    - -ec
    args:
    - |
      echo "decision-maker starting with provider=${DECISION_MAKER_PROVIDER}"
      mkdir -p /tmp/decision-maker "${NPM_CONFIG_CACHE}" "${HOME}"
      cp /opt/decision-maker/server.mjs /tmp/decision-maker/server.mjs
      cd /tmp/decision-maker
      if [ "${DECISION_MAKER_PROVIDER}" = "laya" ]; then
        echo "installing @receptron/laya into /tmp/decision-maker"
        npm init -y >/dev/null 2>&1
        npm install --omit=dev @receptron/laya
        echo "finished installing @receptron/laya"
      fi
      exec node /tmp/decision-maker/server.mjs
    env:
    - name: DECISION_MAKER_PROVIDER
      valueFrom:
        configMapKeyRef:
          name: api-extension-decision-maker
          key: provider
    - name: DECISION_MAKER_PORT
      valueFrom:
        configMapKeyRef:
          name: api-extension-decision-maker
          key: port
    - name: LAYA_CACHE
      valueFrom:
        configMapKeyRef:
          name: api-extension-decision-maker
          key: laya-cache
    - name: HOME
      value: /tmp/decision-maker/home
    - name: NPM_CONFIG_CACHE
      value: /var/cache/laya/.npm
    - name: HF_TOKEN
      valueFrom:
        secretKeyRef:
          name: api-extension-decision-maker-secrets
          key: hf-token
          optional: true
    ports:
    - containerPort: 8088
      name: decision-http
      protocol: TCP
    startupProbe:
      httpGet:
        path: /healthz
        port: decision-http
      initialDelaySeconds: 5
      periodSeconds: 10
      failureThreshold: 90
    readinessProbe:
      httpGet:
        path: /healthz
        port: decision-http
      initialDelaySeconds: 2
      periodSeconds: 10
    livenessProbe:
      httpGet:
        path: /healthz
        port: decision-http
      initialDelaySeconds: 10
      periodSeconds: 20
    securityContext:
      allowPrivilegeEscalation: false
      runAsNonRoot: true
      runAsUser: 65532
      runAsGroup: 65532
      readOnlyRootFilesystem: false
      capabilities:
        drop:
        - ALL
      seccompProfile:
        type: RuntimeDefault
    resources:
      requests:
        cpu: 250m
        memory: 1Gi
      limits:
        cpu: 2
        memory: 4Gi
    volumeMounts:
    - mountPath: /opt/decision-maker/server.mjs
      name: decision-maker-script
      subPath: server.mjs
      readOnly: true
    - mountPath: /var/cache/laya
      name: decision-maker-cache

# - op: add
#   path: /spec/template/spec/containers/0/volumeMounts/-
#   value:
#     mountPath: /tmp/harikube-middleware-crt
#     name: harikube-middleware-crt
#     readOnly: true

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: apiserver-certs
    secret:
      secretName: v1-api-extension-tls

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: harikube-connection
    secret:
      secretName: api-extension-harikube-connection

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: decision-maker-script
    configMap:
      name: api-extension-decision-maker
      items:
      - key: server.mjs
        path: server.mjs

- op: add
  path: /spec/template/spec/volumes/-
  value:
    name: decision-maker-cache
    persistentVolumeClaim:
      claimName: api-extension-decision-maker-cache

